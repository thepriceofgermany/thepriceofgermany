<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Price of Germany">
  <rect width="64" height="64" rx="14" fill="#FDF8F0"/>
  <!-- price tag body, rotated -->
  <g transform="rotate(-18 32 32)">
    <path d="M14 22 h26 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-26 l-8 -11 z"
          fill="#FF5A5F" stroke="#E1454A" stroke-width="2" stroke-linejoin="round"/>
    <!-- punch hole -->
    <circle cx="13" cy="33" r="3.4" fill="#FDF8F0"/>
    <!-- euro glyph -->
    <text x="28" y="39" font-family="Fredoka, Arial, sans-serif" font-size="18"
          font-weight="700" fill="#FFFDF6" text-anchor="middle">&#8364;</text>
  </g>
</svg>
